<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Ascents &vert; Login</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & SweetAlert -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header>
      <nav class="navbar navbar-expand-lg" id="Nav" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand py-0 m-0" href="index.html">
            <img src="Alpine_Ascents_logo-removebg-preview.png" alt="Alpine Ascents" height="100" width="100" class="d-block">
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                  data-bs-target="#mainNav" aria-controls="mainNav"
                  aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-5">
              <li class="nav-item"><a class="nav-link navitem" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link navitem" href="Schools.html">Schools</a></li>
              <li class="nav-item"><a class="nav-link navitem" href="Courses.html">Courses</a></li>
              <li class="nav-item"><a class="nav-link navitem" href="Gear.html">Gear</a></li>
              <li class="nav-item"><a class="nav-link navitem" href="History.html">History</a></li>
              <li class="nav-item dropdown">
                <a class="nav-link navitem dropdown-toggle" href="#" id="moreDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  More
                </a>
                <ul class="dropdown-menu" aria-labelledby="moreDropdown">
                  <li><a class="dropdown-item" href="contact.html">Contact Us</a></li>
                  <li><a class="dropdown-item" href="Feedback.html">Feedback</a></li>
                </ul>
              </li>
            </ul>
            <a class="btn" id="loginbtn" href="login.html">Login / Sign Up</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="login-section">
        <div class="login-card">
            <div class="text-center mb-4">
                <h2 class="login-title">Welcome Back</h2>
                <p class="login-subtitle">Log in to continue your ascent.</p>
            </div>

            <form onsubmit="return false;">
                <div class="mb-3">
                    <label for="emailInput" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="emailInput" placeholder="jonathan@example.com" required>
                </div>

                <div class="mb-4">
                    <label for="passwordInput" class="form-label">Password</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Enter your password" required>
                </div>

                <button type="button" onclick="login()" class="btn login-btn w-100 mb-3">Log In</button>

                <p class="text-center signup-link">
                    Don't have an account? <a href="signup.html">Sign up here</a>
                </p>
            </form>
        </div>
    </main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
